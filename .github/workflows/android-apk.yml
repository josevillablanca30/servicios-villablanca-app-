name: Compilar y probar Servicios Villablanca Android

on:
  workflow_dispatch:
    inputs:
      test_emulator:
        description: Test launch in an Android emulator
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['app/**', '*.gradle*', 'gradle/**', 'gradle.properties', '.github/workflows/android-apk.yml']

permissions:
  contents: read
concurrency:
  group: servicios-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source formatting and Android XML
        run: |
          git diff --check HEAD^
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('app/src').rglob('*.xml'):
              ET.parse(p)
          assert pathlib.Path('app/src/main/AndroidManifest.xml').is_file()
          PY
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No se encontró sdkmanager en $SDK_ROOT"; exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug con Android Gradle Plugin oficial
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Comprobar estructura del APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'resources.arsc'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Publicar APK compilado para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: Villablanca-APK-Instalable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: reactivecircus/android-emulator-runner@v2
        if: inputs.test_emulator
        name: Probar apertura real en emulador
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n cl.villablanca.servicios.demo/.MainActivity
            sleep 12
            adb shell pidof cl.villablanca.servicios.demo | grep -E '[0-9]+'
            adb logcat -d -b crash > /tmp/villablanca-crash.log
            if grep -q 'FATAL EXCEPTION' /tmp/villablanca-crash.log; then cat /tmp/villablanca-crash.log; exit 1; fi
            adb shell screencap -p /sdcard/villablanca-demo.png
            adb pull /sdcard/villablanca-demo.png villablanca-demo.png
      - name: Entregar captura del emulador
        if: inputs.test_emulator
        uses: actions/upload-artifact@v4
        with:
          name: Villablanca-Android-Captura
          path: villablanca-demo.png
          if-no-files-found: error
          retention-days: 7
