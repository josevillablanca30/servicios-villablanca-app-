name: Monitor de salud Servicios Villablanca
on:
  schedule:
    - cron: '17 10,22 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar consulta de base de datos sin acceder a clientes
        shell: bash
        run: |
          set -euo pipefail
          # La clave publicable está disponible en el cliente web y su acceso está limitado por permisos.
          URL=$(sed -n "s/.*url: '\([^']*\)'.*/\1/p" app/src/main/assets/cloud-config.js)
          KEY=$(sed -n "s/.*publishableKey: '\([^']*\)'.*/\1/p" app/src/main/assets/cloud-config.js)
          test -n "$URL" && test -n "$KEY"
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{}' "$URL/rest/v1/rpc/vb_public_health" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True'
      - name: Resultado
        run: echo "Consulta SQL pública de salud ejecutada correctamente"
