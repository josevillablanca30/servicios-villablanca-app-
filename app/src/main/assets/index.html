  function topStep(){
    if(['home','catalog'].includes(state.view))return '';
    const checkoutEnabled=state.cart.length>0&&calcQuote(state.cart,state.client).allKnown&&!calcQuote(state.cart,state.client).travelPending;
    const steps=checkoutEnabled?['Servicio','Personalizar','Dirección y agenda','Resumen','Pago']:['Servicio','Personalizar','Dirección y agenda','Confirmar'];
    const pos=state.view==='configure'?1:state.view==='booking'?2:state.view==='checkout'?4:3;
    return `<div class="steps container" aria-label="Progreso"><div class="step-mini">PASO ${pos+1} DE ${steps.length}</div><div class="step-track">${steps.map((v,i)=>`<div class="step-segment ${i<=pos?'selected':''}" title="${v}"></div>`).join('')}</div><div class="step-label">${esc(steps[pos])}</div></div>`;
  }

s><details><summary>¿Qué pasa si agrego un extra sin precio?</summary><p>Se incluye en tu solicitud como «a cotizar». Nunca te mostramos una cifra inventada.</p></details><details><summary>¿En qué comunas atienden?</summary><p>Los valores de lavado de vehículos publicados corresponden a San Felipe y Los Andes. Para otras comunas, o para confirmar cobertura de otros servicios, te respondemos por WhatsApp.</p></details></div></section></main>`}
  function card(c,i){return `<button data-action="category" data-id="${c.id}" class="service-card ${i===0?'service-card-main':''}" aria-label="Ver ${esc(c.name)}"><div class="card-visual ${!c.image?'abstract-card':''}">${c.image?`<img src="${c.image}" alt="" loading="lazy"/>`:`<span class="big-abstract-icon">${icon(c.icon,77)}</span>`}<div class="card-fade"></div></div><div class="card-foot"><div class="card-number">${c.accent} / SERVICIO</div><div class="card-line"><div><h3>${esc(c.name)}</h3><p>${esc(c.subtitle)}</p></div><span class="circle-arrow">${icon('arrow',19)}</span></div></div></button>`}
  function catalog(){const cats=state.filter==='all'?C.categories:C.categories.filter(c=>c.id===state.filter);const q=state.query.toLowerCase();const entries=cats.map(c=>({c,items:C.services.filter(s=>s.category===c.id&&(!q||s.name.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)))})).filter(x=>x.items.length);return `<main id="content" class="container catalog-page"><button data-action="home" class="back-link">${icon('back',17)} Inicio</button><div class="section-eyebrow">EXPLORA EL CATÁLOGO</div><h1 class="page-title">Servicios para que todo <em>brille.</em></h1><p class="page-subtitle">Elige un servicio, indica cantidades y suma complementos antes de solicitarlo.</p><div class="search-wrap">${icon('search',21)}<input aria-label="Buscar servicios" placeholder="Buscar aseo, sofá, vidrios, auto..." data-field="search" value="${esc(state.query)}" /></div><div class="filter-scroll"><button class="filter-chip ${state.filter==='all'?'on':''}" data-action="filter" data-id="all">Todos</button>${C.categories.map(c=>`<button class="filter-chip ${state.filter===c.id?'on':''}" data-action="filter" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div>${entries.length?entries.map(({c,items})=>`<section class="catalog-section"><div class="catalog-cat-heading"><span class="category-icon">${icon(c.icon,24)}</span><div><h2>${esc(c.name)}</h2><p>${esc(c.subtitle)}</p></div></div><div class="catalog-items">${items.map(s=>`<button class="catalog-item" data-action="selectService" data-id="${s.id}"><span class="service-info"><strong>${esc(s.name)}</strong><small>${isHourlyHome(s)?`Desde ${format(s.price)} por hora · mínimo ${s.minHours||4} horas`:s.pricing==='referencia-sin-unidad'?'Mínimo 4 horas · valor final por confirmar':s.proposed?'Servicio sujeto a evaluación':s.description?esc(s.description):'Personaliza tu solicitud'}</small></span><span class="item-price">${priceInfo(s)}</span><span class="catalog-arrow">${icon('arrow',19)}</span></button>`).join('')}</div></section>`).join(''):`<div class="empty-state">${icon('search',40)}<h3>No encontramos coincidencias</h3><p>Prueba otra palabra o vuelve a ver todos los servicios.</p><button class="btn btn-outline" data-action="clearSearch">Limpiar búsqueda</button></div>`}</main>`}
  const control=(name,key,value,opts,help='')=>`<label class="field"><span>${esc(name)}</span><select data-field="draft:${key}" aria-label="${esc(name)}">${opts.map(opt=>`<option ${String(opt)===String(value)?'selected':''} value="${esc(opt)}">${esc(opt)}</option>`).join('')}</select>${help?`<small>${esc(help)}</small>`:''}</label>`;
  const countControl=(label,qty,minusAction,plusAction,id,min=0,max=30,help='')=>`<div class="quantity-row"><div><strong>${esc(label)}</strong>${help?`<small>${esc(help)}</small>`:''}</div><div class="counter"><button type="button" data-action="${minusAction}" data-id="${esc(id)}" ${qty<=min?'disabled':''} aria-label="Quitar ${esc(label)}">${icon('minus',16)}</button><output aria-label="Cantidad ${esc(label)}">${qty}</output><button type="button" data-action="${plusAction}" data-id="${esc(id)}" ${qty>=max?'disabled':''} aria-label="Agregar ${esc(label)}">${icon('plus',16)}</button></div></div>`;
  function detailsFields(s){const d=state.draft.details; if(isHome(s))return `<div class="field-grid">${control('Tipo de vivienda','house',d.house,['Casa','Departamento','Otro'])}${control('Frecuencia','frequency',d.frequency,['Única','Semanal','Quincenal','Mensual'])}${control('Dormitorios','bedrooms',d.bedrooms,['1','2','3','4','5','6 o más'])}${control('Baños','bathrooms',d.bathrooms,['1','2','3','4','5 o más'])}</div>${countControl('Horas de aseo solicitadas',Number(d.hours),'decHours','incHours','hours',4,12,'Mínimo 4 horas según el catálogo publicado.')}<label class="field"><span>Metros cuadrados aproximados (opcional)</span><input type="number" min="0" placeholder="Ej. 85" data-field="draft:m2" value="${esc(d.m2||'')}"></label><div class="included"><strong>${icon('check',18)} En el aseo hogar publicado</strong><p>Aspirado y trapeado, limpieza general de muebles, cocina, dormitorios (incluido cambio de sábanas) y baños. Según tiempo disponible, sujeto a confirmación.</p></div>`;
    if(s.category==='piscinas')return `<div class="field-grid">${control('Tipo de piscina','poolType',d.poolType,['Enterrada','Desmontable','Otra'])}${control('Frecuencia deseada','frequency',d.frequency,['Única','Semanal','Quincenal','Mensual'])}</div><label class="field"><span>Tamaño aproximado de piscina (opcional)</span><input data-field="draft:poolSize" placeholder="Ej. 6 x 3 metros" value="${esc(d.poolSize||'')}"></label>`;
    if(s.category==='jardineria')return `<label class="field"><span>Superficie aproximada de jardín (m²)</span><input type="number" min="0" data-field="draft:m2" placeholder="Ej. 120" value="${esc(d.m2||'')}"></label>${control('Frecuencia','frequency',d.frequency,['Única','Semanal','Quincenal','Mensual'])}`;
    if(s.category==='mantenimiento')return `<label class="field"><span>Describe brevemente qué necesitas reparar o revisar</span><textarea data-field="draft:work" rows="4" placeholder="Por ejemplo: revisar una puerta, corregir una filtración...">${esc(d.work||'')}</textarea></label>`;
    if(s.category==='vidrios')return `<div class="field-grid">${control('Lugar','location',d.location,['Casa','Departamento','Local comercial','Oficina','Otro'])}${control('Acceso y altura','height',d.height,['Primer piso','Segundo piso','Altura mayor (evaluar)'])}</div>`;
    if(s.category==='postobra'||s.category==='industrial')return `<label class="field"><span>Superficie aproximada (m²), si la sabes</span><input type="number" min="0" data-field="draft:m2" placeholder="Ej. 100" value="${esc(d.m2||'')}"></label>`;
    return '';
  }
  function configure(){const s=getService(state.draft?.id);if(!s)return catalog();const c=getCat(s.category);const extras=getExtrasFor(s),d=state.draft;const groups=[...new Set(extras.map(e=>e.group))];return `<main id="content" class="container configurator">${topStep()}<button data-action="catalog" class="back-link">${icon('back',17)} Volver al catálogo</button><div class="configure-layout"><section class="configure-main"><span class="pill-outline">${icon(c.icon,17)} ${esc(c.name)}</span><h1 class="page-title">Hazlo <em>a tu medida.</em></h1><p class="page-subtitle">Seleccionaste: <strong>${esc(s.name)}</strong></p><div class="selection-summary"><div><h2>${esc(s.name)}</h2>${s.description?`<p>${esc(s.description)}</p>`:''}${s.note?`<p class="note">${esc(s.note)}</p>`:''}</div><div class="price-at-side">${priceInfo(s)}</div></div><section class="form-card"><div class="sub-heading"><span>01</span><div><h2>Tu servicio</h2><p>Cuéntanos el alcance y las cantidades.</p></div></div>${countControl(isHourlyHome(s)?'Cantidad de visitas':'Cantidad de servicios / unidades',d.qty,'decMain','incMain','main',1,25)}${detailsFields(s)}<label class="field"><span>Detalles adicionales (opcional)</span><textarea rows="3" data-field="draft:note" placeholder="Cuéntanos cualquier detalle especial...">${esc(d.note||'')}</textarea></label></section>${groups.map((g,i)=>`<section class="form-card"><div class="sub-heading"><span>${String(i+2).padStart(2,'0')}</span><div><h2>${esc(g)}</h2><p>Complementos opcionales, agrega solo si los necesitas.</p></div></div>${extras.filter(e=>e.group===g).map(e=>countControl(e.name,d.extras[e.id]||0,'decExtra','incExtra',e.id,0,20,e.price==null?'Valor adicional a cotizar':`+ ${format(e.price)} / ${e.unit}`)).join('')}</section>`).join('')}<div class="mobile-cta-spacer"></div></section><aside class="config-side"><div class="side-sticky"><span class="section-eyebrow">TU SELECCIÓN</span><h3>${esc(s.name)}</h3><div class="small-stat">${icon('check',19)} ${activeExtraCount(d.extras)} complementos seleccionados</div><div class="small-stat">${icon('clock',19)} ${isHourlyHome(s)?`${d.details.hours} h por visita`:(isHome(s)?d.details.hours+' h solicitadas':'Fecha a elegir')}</div><div class="side-price">${isHourlyHome(s)?'Tarifa por hora':(s.pricing==='referencia-sin-unidad'?'Tarifa publicada':'Valor publicado')}<b>${s.price==null?'A cotizar':format(s.price)}</b><small>${isHourlyHome(s)?`Estimado base: ${format((s.price||0)*(Number(d.details.hours||4)||4)*Math.max(1,Number(d.qty||1)||1))}`:(s.pricing==='referencia-sin-unidad'?'El valor final se confirmará':s.price==null?'Según evaluación':'Antes de confirmar tu visita')}</small></div><button class="btn btn-primary full" data-action="addCart">${state.editIndex==null?'Agregar a mi solicitud':'Guardar cambios'} ${icon('arrow',18)}</button><p class="privacy-small">Solicitud lista para confirmar. Los pagos con tarjeta y cuotas se habilitarán al activar la cuenta de pagos del negocio.</p></div></aside></div><div class="mobile-fixed-bar"><div><small>${activeExtraCount(d.extras)} extras</small><b>${s.price==null?'A cotizar':(isHourlyHome(s)?`Desde ${format((s.price||0)*(Number(d.details.hours||4)||4)*Math.max(1,Number(d.qty||1)||1))}`:(s.pricing==='referencia-sin-unidad'?'Tarifa a confirmar':format(s.price)))}</b></div><button class="btn btn-primary" data-action="addCart">Continuar ${icon('arrow',16)}</button></div></main>`}
  function cartLine(line,index){const s=getService(line.id);const x=getExtrasFor(s).filter(e=>(line.extras?.[e.id]||0)>0);return `<div class="cart-line"><div class="cart-line-icon">${icon(getCat(s.category).icon,22)}</div><div class="cart-line-content"><strong>${esc(s.name)}</strong><small>Cantidad: ${line.qty}${isHourlyHome(s)?` · ${getHomeHours(line)} h por visita`:(isHome(s)?` · ${esc(line.details.hours)} h`:``)}${x.length?` · ${x.length} extras`:''}</small>${x.length?`<div class="small-extras">${x.map(e=>`${esc(e.name)} ×${line.extras[e.id]}`).join(' · ')}</div>`:''}</div><div class="cart-line-tools"><button aria-label="Editar servicio" data-action="editLine" data-id="${index}">${icon('edit',18)}</button><button aria-label="Quitar servicio" data-action="removeLine" data-id="${index}">${icon('trash',18)}</button></div></div>`}
  function quoteBox(){if(!state.cart.length)return '';const quote=calcQuote(state.cart,state.client);return `<div class="quote-box"><div class="quote-title">${isQuoteVisit()?'VALORES PENDIENTES DE COTIZACIÓN':'RESUMEN DE TARIFAS'}</div>${state.cart.map((line)=>{const s=getService(line.id);return `<div class="quote-row"><span>${esc(s.name)} ×${line.qty}</span><b>${getBaseLineTotal(line)==null?'A cotizar':format(getBaseLineTotal(line))}</b></div><div class="quote-row subline"><span>${isHourlyHome(s)?`Base ${format(s.price)} por hora · ${getHomeHours(line)} h`:s.price==null?'Valor base a evaluar':'Tarifa base publicada'}</span><b>${lineBaseLabel(line)}</b></div>${getExtrasFor(s).filter(e=>(line.extras?.[e.id]||0)>0).map(e=>`<div class="quote-row subline"><span>${esc(e.name)} ×${line.extras[e.id]}</span><b>${e.price==null?'A cotizar':format(e.price*line.extras[e.id])}</b></div>`).join('')}`}).join('')}${quote.travel?`<div class="quote-row"><span>Recargo lavado auto · fuera de San Felipe/Los Andes</span><b>${format(5000)}</b></div>`:''}${quote.travelPending?`<p class="quote-warning">Recargo de traslado de lavado de vehículos sujeto a comuna exacta.</p>`:''}<div class="quote-total"><div><span>${quote.allKnown?'Total estimado':'Subtotal parcial (no es el valor final)'}</span><strong>${quote.known===0&&!quote.allKnown?'Por definir':format(quote.known)}</strong></div>${quote.unknown||quote.ambiguous?`<p>Hay ${quote.unknown} ítem(s) a cotizar y ${quote.ambiguous} tarifa(s) por aclarar. <b>No es el valor final.</b></p>`:`<p>Valor estimado según catálogo y extras seleccionados. Se confirma antes de agendar.</p>`}</div></div>`}
  function booking(){if(!state.cart.length)return catalog();const a=state.client,err=state.errors,workshop=isWorkshopOnly(),quote=isQuoteVisit();return `<main id="content" class="container booking-page">${topStep()}<button class="back-link" data-action="catalog">${icon('back',17)} Agregar más servicios</button><div class="section-eyebrow">${quote?'AGENDA TU EVALUACIÓN':'DATOS PARA TU VISITA'}</div><h1 class="page-title">${quote?'Solicita una <em>visita de cotización.</em>':'Ya casi <em>terminamos.</em>'}</h1><p class="page-subtitle">${quote?'Cuéntanos dónde debemos evaluar el trabajo y cuándo te acomoda que vayamos. Coordinaremos la visita por WhatsApp.':'Elige tu fecha preferida. Nada queda reservado hasta que lo confirmemos contigo.'}</p><div class="booking-grid"><section><div class="form-card"><div class="sub-heading"><span>01</span><div><h2>Mi solicitud (${state.cart.length})</h2><p>Puedes editar o agregar servicios antes de enviar.</p></div></div>${state.cart.map(cartLine).join('')}<button class="btn btn-outline" data-action="catalog">${icon('plus',17)} Agregar otro servicio</button></div><div class="form-card"><div class="sub-heading"><span>02</span><div><h2>${workshop?'Entrega en instalaciones':quote?'Dirección para evaluación':'Dirección'}</h2><p>${workshop?'Coordinaremos la recepción de tus artículos por WhatsApp.':quote?'¿Dónde hacemos la visita para preparar tu presupuesto?':'¿Dónde necesitas el servicio?'}</p></div></div><div class="field-grid"><label class="field"><span>Comuna ${workshop?'(opcional)':'*'}</span><select data-field="client:commune"><option value="">Seleccionar comuna</option>${C.communities.map(v=>`<option ${a.commune===v?'selected':''}>${esc(v)}</option>`).join('')}</select>${err.commune?`<small class="error">${esc(err.commune)}</small>`:''}</label><label class="field"><span>${workshop?'Dirección de referencia (opcional)':'Calle y número *'}</span><input data-field="client:address" autocomplete="street-address" placeholder="Ej. Av. Ejemplo 123" value="${esc(a.address)}">${err.address?`<small class="error">${esc(err.address)}</small>`:''}</label></div><label class="field"><span>Departamento / referencia (opcional)</span><input data-field="client:detail" placeholder="Ej. Casa azul, timbre 2" value="${esc(a.detail)}"></label><p class="support-note">Si seleccionas un artículo que se entrega en instalaciones, coordinaremos su recepción por WhatsApp.</p></div><div class="form-card"><div class="sub-heading"><span>03</span><div><h2>${quote?'Fecha para la evaluación':'Fecha preferida'}</h2><p>${workshop?'Acordaremos por WhatsApp fecha y lugar de entrega.':quote?'Selecciona un día para que evaluemos el trabajo presencialmente.':'Nosotros confirmamos disponibilidad y horario.'}</p></div></div><div class="field-grid"><label class="field"><span>${workshop?'Día preferido de entrega *':quote?'Día preferido para cotizar *':'Día de servicio *'}</span><input type="date" data-field="client:day" min="${todayChile()}" value="${esc(a.day)}">${err.day?`<small class="error">${esc(err.day)}</small>`:''}</label><label class="field"><span>Bloque horario preferido *</span><select data-field="client:slot"><option value="">Seleccionar horario</option>${['Mañana · 09:00 a 12:00','Tarde · 14:00 a 18:00','Flexible · por coordinar'].map(v=>`<option ${a.slot===v?'selected':''}>${esc(v)}</option>`).join('')}</select>${err.slot?`<small class="error">${esc(err.slot)}</small>`:''}</label></div>${quote?`<label class="field"><span>Fecha alternativa (opcional)</span><input type="date" data-field="client:alternateDay" min="${todayChile()}" value="${esc(a.alternateDay)}">${err.alternateDay?`<small class="error">${esc(err.alternateDay)}</small>`:''}</label><p class="support-note">La segunda fecha ayuda a encontrar un espacio si el primero no está disponible.</p>`:''}<div class="notice">${icon('info',20)} ${quote?'Solicitas una visita de evaluación, no una ejecución del servicio.':'Esta fecha es una preferencia.'} <strong>Confirmaremos el horario por WhatsApp.</strong> ${quote?'El costo de la visita, si corresponde, se informa antes de confirmarla.':''}</div></div><div class="form-card"><div class="sub-heading"><span>04</span><div><h2>Tus datos</h2><p>Solo para responder a tu solicitud por WhatsApp.</p></div></div><div class="field-grid"><label class="field"><span>Nombre y apellido *</span><input data-field="client:name" autocomplete="name" placeholder="Tu nombre" value="${esc(a.name)}">${err.name?`<small class="error">${esc(err.name)}</small>`:''}</label><label class="field"><span>WhatsApp de contacto *</span><input type="tel" data-field="client:phone" autocomplete="tel" placeholder="9 1234 5678" value="${esc(a.phone)}">${err.phone?`<small class="error">${esc(err.phone)}</small>`:''}</label></div><label class="field"><span>Correo electrónico (opcional)</span><input type="email" data-field="client:email" autocomplete="email" placeholder="nombre@correo.cl" value="${esc(a.email)}">${err.email?`<small class="error">${esc(err.email)}</small>`:''}</label><label class="field"><span>Comentarios para el equipo (opcional)</span><textarea rows="3" data-field="client:notes" placeholder="Acceso, materiales, prioridades, etc.">${esc(a.notes)}</textarea></label></div><div class="mobile-cta-spacer"></div></section><aside class="book-sidebar"><div class="side-sticky">${quoteBox()}<button class="btn btn-primary full" data-action="review">Revisar mi solicitud ${icon('arrow',19)}</button><p class="privacy-small">Esta demo no guarda tus datos en servidores. El pago será procesado por la pasarela del negocio después de su activación.</p></div></aside></div><div class="mobile-fixed-bar"><div><small>${state.cart.length} servicio(s)</small><b>Por confirmar</b></div><button class="btn btn-primary" data-action="review">Revisar ${icon('arrow',16)}</button></div></main>`}
  function displayDetails(line){const d=line.details||{},s=getService(line.id),bits=[];if(isHome(s))bits.push(`${d.house||'Casa'}, ${d.bedrooms||'?'} dormitorio(s), ${d.bathrooms||'?'} baño(s)`,`${d.hours||4} horas`, `Frecuencia: ${d.frequency||'Única'}`);if(d.m2)bits.push(`${d.m2} m² aprox.`);if(d.poolType)bits.push(`Piscina: ${d.poolType}`);if(d.poolSize)bits.push(`Tamaño: ${d.poolSize}`);if(d.location)bits.push(`Lugar: ${d.location}`);if(d.height)bits.push(`Acceso: ${d.height}`);if(d.frequency&&!isHome(s))bits.push(`Frecuencia: ${d.frequency}`);if(d.work)bits.push(`Detalle: ${d.work}`);if(line.note)bits.push(`Nota: ${line.note}`);return bits;}
  function review(){const a=state.client;if(!state.cart.length)return catalog();return `<main id="content" class="container review-page">${topStep()}<button data-action="backBooking" class="back-link">${icon('back',17)} Editar datos y fecha</button><div class="section-eyebrow">REVISIÓN FINAL</div><h1 class="page-title">${isQuoteVisit()?'Revisa tu <em>visita de evaluación.</em>':'Revisa tu <em>compra.</em>'}</h1><p class="page-subtitle">${isQuoteVisit()?'Enviaremos tus datos y la fecha preferida para coordinar la cotización presencial por WhatsApp. No se trata de una visita confirmada.':'Comprueba tus servicios, extras, dirección y horario antes de avanzar al pago. La fecha se confirma después de coordinar.'}</p><div class="review-grid"><div><section class="form-card"><div class="sub-heading"><span>01</span><div><h2>Servicios seleccionados</h2><p>Lo que necesitamos cotizar y coordinar.</p></div></div>${state.cart.map((line,i)=>`<div class="review-line"><div><strong>${esc(getService(line.id).name)} · x${line.qty}</strong>${displayDetails(line).map(v=>`<p>${esc(v)}</p>`).join('')}${Object.entries(line.extras||{}).filter(([,v])=>v>0).map(([k,v])=>`<p>+ ${esc([...C.extras,...C.vehicleExtras].find(e=>e.id===k)?.name||k)} ×${v} · ${[...C.extras,...C.vehicleExtras].find(e=>e.id===k)?.price==null?'a cotizar':format([...C.extras,...C.vehicleExtras].find(e=>e.id===k).price*v)}</p>`).join('')}</div><button data-action="editLine" data-id="${i}" aria-label="Editar ${esc(getService(line.id).name)}">${icon('edit',18)}</button></div>`).join('')}</section><section class="form-card"><div class="sub-heading"><span>02</span><div><h2>${isQuoteVisit()?'Datos para cotización':'Datos de la visita'}</h2></div></div><div class="review-info"><p>${icon('location',19)} ${isWorkshopOnly()?'Entrega en instalaciones (a coordinar)':`${esc(a.address)}, ${esc(a.commune)} ${a.detail?', '+esc(a.detail):''}`}</p><p>${icon('calendar',19)} ${esc(a.day)} · ${esc(a.slot)} <small>(preferencia)</small></p>${isQuoteVisit()&&a.alternateDay?`<p>${icon('calendar',19)} Alternativa: ${esc(a.alternateDay)} (preferencia)</p>`:''}<p>${icon('heart',19)} ${esc(a.name)} · ${esc(a.phone)}</p>${a.email?`<p>✉ ${esc(a.email)}</p>`:''}${a.notes?`<p>${esc(a.notes)}</p>`:''}</div><button class="text-link" data-action="backBooking">Editar estos datos ${icon('edit',16)}</button></section></div><aside class="review-aside">${quoteBox()}<div class="send-card"><div class="send-icon">${icon(isQuoteVisit()?'message':'credit-card',28)}</div><h3>${isQuoteVisit()?'Solicita tu visita de evaluación':'Tu próximo paso: pagar'}</h3><p>${isQuoteVisit()?'Recibiremos el detalle para proponer una fecha y luego preparar tu cotización. La visita de evaluación no está automáticamente confirmada.':'Revisa el total calculado y entra al checkout de tarjeta. En esta demo no se cobrará dinero ni se confirmará automáticamente una hora.'}</p><div class="payment-box"><div class="payment-title">${isQuoteVisit()?'VISITA PARA COTIZACIÓN':'RESUMEN DE COMPRA'}</div><p class="payment-note">${isQuoteVisit()?'Te contactaremos para confirmar tu visita y evaluar el trabajo. El presupuesto se enviará después de cotizar.':`Total estimado de la selección: <strong>${format(calcQuote(state.cart,state.client).known)}</strong>. La pasarela de tarjetas se presenta en el siguiente paso.`}</p></div>${isQuoteVisit()?`<label class="consent"><input type="checkbox" data-field="client:consent" ${a.consent?'checked':''}><span>Acepto compartir estos datos por WhatsApp para gestionar mi solicitud.</span></label>`:''}<div id="consent-error" class="error" role="alert">${esc(state.errors.consent||'')}</div>${isQuoteVisit()?`<button class="btn btn-primary full" data-action="sendWhatsapp">Solicitar visita de cotización ${icon('external',17)}</button>`:`<button class="btn btn-primary full" data-action="goCheckout">Ir a pagar ${format(calcQuote(state.cart,state.client).known)} ${icon('arrow',18)}</button>`}${isQuoteVisit()?`<button data-action="copyText" class="subtle-action">Copiar detalle de solicitud</button>`:''}<div id="copy-result" class="copy-result" aria-live="polite"></div></div></aside></div></main>`}
  function checkout(){
    if(!state.cart.length)return catalog();
    const q=calcQuote(state.cart,state.client);
    if(!q.allKnown||q.travelPending)return review();
    const a=state.client, method=state.paymentMethod;
    return `<main id="content" class="container payment-page">${topStep()}
      <button class="back-link" data-action="backReview">${icon('back',17)} Volver a revisar mi compra</button>
      <div class="section-eyebrow">PASO FINAL · PAGO SEGURO</div>
      <h1 class="page-title">Es momento de <em>pagar.</em></h1>
      <p class="page-subtitle">Ya configuraste el servicio, los extras y tu visita. Elige cómo quieres pagar. Esta demostración termina justo antes de conectarse con el proveedor de pagos.</p>
      <div class="pay-grid"><section>
        <div class="pay-card"><div class="pay-card-head">${icon('shield',22)} <div><h2>Selecciona tu medio de pago</h2><p>Transacción protegida por un proveedor autorizado una vez activado.</p></div></div>
          <div role="radiogroup" aria-label="Forma de pago">
          <button class="pay-method ${method==='credit'?'selected':''}" role="radio" aria-checked="${method==='credit'}" data-action="choosePayment" data-id="credit"><span class="method-icon">${icon('credit-card',27)}</span><span class="method-copy"><strong>Tarjeta de crédito</strong><small>Compra en línea y cuotas según condiciones de tu banco y pasarela</small></span><span class="radio-dot"></span></button>
          <button class="pay-method ${method==='debit'?'selected':''}" role="radio" aria-checked="${method==='debit'}" data-action="choosePayment" data-id="debit"><span class="method-icon">${icon('wallet',27)}</span><span class="method-copy"><strong>Tarjeta de débito</strong><small>Pago online desde tu cuenta bancaria</small></span><span class="radio-dot"></span></button>
          </div><div class="payment-guidance">${icon('shield',18)} Nunca ingreses los datos de tu tarjeta en esta demo. En la versión activa pagarás dentro del entorno seguro de Mercado Pago o Webpay.</div>
        </div>
        <div class="pay-card visit-summary"><div class="pay-card-head">${icon('calendar',22)} <div><h2>Tu visita</h2><p>Los datos que revisaste antes del pago.</p></div></div><p><strong>${esc(a.day)}</strong> · ${esc(a.slot)}</p><p>${esc(a.address)}, ${esc(a.commune)}</p><p>${esc(a.name)} · ${esc(a.phone)}</p><small class="visit-notice">Horario sujeto a disponibilidad y confirmación del negocio. No se genera una reserva al pagar en esta demo.</small></div>
      </section><aside><div class="payment-sticky">${quoteBox()}
        <div class="payment-total-line"><span>TOTAL ESTIMADO</span><strong>${format(q.known)}</strong></div>
        <button class="btn btn-primary full pay-action" data-action="payNow">${icon('lock',18)} Continuar al pago seguro ${icon('arrow',17)}</button>
        <div class="payment-security">${icon('shield',16)} Sin cargos en esta demostración · Sin captura de tarjetas</div>
      </div></aside></div>
      ${state.activationOpen?`<div class="activation-overlay" role="presentation"><div class="activation-dialog" role="dialog" aria-modal="true" aria-labelledby="activation-title" tabindex="-1"><span class="activation-status">${icon('lock',18)} ETAPA FINAL DE IMPLEMENTACIÓN</span><div class="activation-check">${icon('shield',33)}</div><h2 id="activation-title">Tu compra llegó hasta el pago.</h2><p>Este es el punto exacto donde la aplicación se conectará con la cuenta de <strong>Mercado Pago o Webpay del negocio</strong> cuando el proyecto esté aprobado.</p><div class="activation-row">${icon('check',17)} <span>Servicios, extras, dirección y total: listos.</span></div><div class="activation-row">${icon('check',17)} <span>Crédito y débito: preparados para integrar.</span></div><div class="activation-row pending">${icon('lock',17)} <span>Pago real: pendiente de conectar las credenciales del comercio.</span></div><div class="activation-amount"><span>Pago que se procesaría</span><strong>${format(q.known)}</strong></div><small>En esta demo no se ingresan tarjetas, no se descuenta dinero y no se confirma ninguna reserva.</small><button class="btn btn-primary full" data-action="closePayment">Volver al checkout</button></div></div>`:''}
      </main>`;
  }
  function footer(){return `<footer><div class="container footer-flex"><div class="footer-brand"><strong>servicios <b>VILLABLANCA</b></strong><span>Tu hogar, en las mejores manos.</span></div><div><a href="https://wa.me/56987729963" target="_blank" rel="noopener noreferrer">+56 9 8772 9963</a><a href="https://www.instagram.com/servicios.villablanca/" target="_blank" rel="noopener noreferrer">Instagram</a></div><small>Precios sujetos a confirmación. Las fechas seleccionadas no constituyen una reserva.</small></div></footer>`}
  function render(scroll=true){document.title='Servicios Villablanca | Servicios a domicilio';$root.innerHTML=header()+(state.view==='home'?hero():state.view==='catalog'?catalog():state.view==='configure'?configure():state.view==='booking'?booking():state.view==='checkout'?checkout():review())+footer();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
  function selectService(id,editIndex=null){const s=getService(id);if(!s)return;state.draft={id,qty:1,extras:{},note:'',details:{house:'Casa',frequency:'Única',bedrooms:'2',bathrooms:'1',hours:4,poolType:'Enterrada',poolSize:'',m2:'',location:'Casa',height:'Primer piso',work:''}};state.editIndex=editIndex;state.view='configure';render();}
  function validateClient(){const a=state.client;const e={};if(!isWorkshopOnly()){if(!a.commune)e.commune='Selecciona tu comuna.';if(a.address.trim().length<5)e.address='Ingresa calle y número.';}if(!a.day||a.day<todayChile())e.day='Elige una fecha válida a partir de hoy.';if(a.alternateDay&&(a.alternateDay<todayChile()||a.alternateDay===a.day))e.alternateDay='Elige otra fecha posterior a hoy y diferente a la principal.';if(!a.slot)e.slot='Selecciona un bloque horario.';if(a.name.trim().length<3)e.name='Ingresa tu nombre y apellido.';const normalized=a.phone.replace(/[^0-9]/g,'');if(!/^(?:56)?9\d{8}$/.test(normalized))e.phone='Usa un celular chileno válido: 9 1234 5678.';if(a.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email))e.email='Revisa el formato de tu correo.';state.errors=e;return Object.keys(e).length===0;}
  function requestText(){
    const a=state.client,quote=calcQuote(state.cart,a),kind=appointmentKind();
    const parts=[kind==='evaluacion'?'Hola, quisiera *agendar una visita de evaluación para cotización* con Servicios Villablanca.':kind==='entrega'?'Hola, quiero coordinar la entrega de artículos a Servicios Villablanca.':'Hola, quiero solicitar un servicio a domicilio con Servicios Villablanca.','','*SERVICIOS SELECCIONADOS*'];
    state.cart.forEach((line,i)=>{
      const s=getService(line.id);
      parts.push(`${i+1}. ${s.name} x${line.qty}`);
      for(const detail of displayDetails(line))parts.push(`   · ${detail}`);
      for(const [key,count] of Object.entries(line.extras||{}))if(count>0){
        const e=[...C.extras,...C.vehicleExtras].find(v=>v.id===key);
        if(e)parts.push(`   + ${e.name} x${count}: ${e.price==null?'a cotizar':format(count*e.price)}`);
      }
      const base=getBaseLineTotal(line);
      parts.push(`   Precio base: ${base==null?'a cotizar':format(base)}${isHourlyHome(s)?` (${format(s.price)}/hora × ${getHomeHours(line)} horas × ${line.qty} visita(s))`:''}`);
    });
    parts.push('');
    if(quote.allKnown)parts.push(`*TOTAL ESTIMADO:* ${format(quote.known)} (a confirmar)`);
    else parts.push(`*SUBTOTAL DE TARIFAS CONOCIDAS:* ${quote.known?format(quote.known):'No disponible'}`,`*PENDIENTE DE COTIZACIÓN:* ${quote.unknown+quote.ambiguous} ítem(s). Este subtotal NO es el precio final.`);
    if(quote.travel)parts.push('Traslado lavado de vehículo a otras comunas: $5.000, según catálogo.');
    if(quote.travelPending)parts.push('Traslado lavado vehículo: sujeto a confirmación de comuna.');
    parts.push('',kind==='evaluacion'?'*SOLICITUD DE VISITA PRESENCIAL DE COTIZACIÓN*':kind==='entrega'?'*ENTREGA DE ARTÍCULOS POR COORDINAR*':'*SOLICITUD DE SERVICIO*');
    if(kind==='entrega')parts.push(`Comuna de referencia: ${a.commune||'A consultar'}`,`Dirección de referencia: ${a.address||'A coordinar'}`);
    else parts.push(`Dirección: ${a.address}${a.detail?', '+a.detail:''}, ${a.commune}`);
    parts.push(`Fecha preferida: ${a.day}`,`Bloque preferido: ${a.slot}`);
    if(kind==='evaluacion'&&a.alternateDay)parts.push(`Fecha alternativa: ${a.alternateDay}`);
    parts.push('','*DATOS DE CONTACTO*',`Nombre: ${a.name}`,`WhatsApp: ${a.phone}`);
    if(a.email)parts.push(`Correo: ${a.email}`);
    if(a.notes)parts.push(`Observaciones: ${a.notes}`);
    parts.push('',kind==='evaluacion'?'La fecha de visita, su eventual costo y el presupuesto final quedan sujetos a confirmación. No estoy pagando ni reservando automáticamente.':'La fecha, cobertura y condiciones finales quedan sujetos a confirmación; esta solicitud no constituye pago ni reserva automática.');
    return parts.join('\n');
  }
  function notifyCopy(message){const el=document.getElementById('copy-result');if(el)el.textContent=message;}
  async function copyText(){const t=requestText();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(t);notifyCopy('Detalle copiado.');}else{const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();notifyCopy('Detalle copiado.');}}catch(_){notifyCopy('No fue posible copiar. Usa el botón de WhatsApp.')}}
  $root.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,id=btn.dataset.id;
    if(action==='home'){state.view='home';render();return;}
    if(action==='catalog'){state.view='catalog';render();return;}
    if(action==='goCart'){state.view=state.cart.length?'booking':'catalog';render();return;}
    if(action==='quickHome'){selectService('aseo-hogar');return;}
    if(action==='category'){state.filter=id;state.query='';state.view='catalog';render();return;}
    if(action==='selectService'){selectService(id);return;}
    if(action==='filter'){state.filter=id;render(false);return;}
    if(action==='clearSearch'){state.query='';state.filter='all';render(false);return;}
    if(action==='incMain'){state.draft.qty=Math.min(25,state.draft.qty+1);render(false);return;}
    if(action==='decMain'){state.draft.qty=Math.max(1,state.draft.qty-1);render(false);return;}
    if(action==='incHours'){state.draft.details.hours=Math.min(12,+state.draft.details.hours+1);render(false);return;}
    if(action==='decHours'){state.draft.details.hours=Math.max(4,+state.draft.details.hours-1);render(false);return;}
    if(action==='incExtra'||action==='decExtra'){let q=state.draft.extras[id]||0;q+=action==='incExtra'?1:-1;state.draft.extras[id]=Math.max(0,Math.min(20,q));render(false);return;}
    if(action==='addCart'){
      const d=structuredClone(state.draft);if(state.editIndex===null)state.cart.push(d);else state.cart[state.editIndex]=d;
      state.draft=null;state.editIndex=null;state.view='booking';render();return;
    }
    if(action==='editLine'){const i=Number(id);const d=state.cart[i];if(!d)return;selectService(d.id,i);state.draft=structuredClone(d);render();return;}
    if(action==='removeLine'){state.cart.splice(Number(id),1);state.view=state.cart.length?'booking':'catalog';render(false);return;}
    if(action==='goCheckout'){
      if(!state.cart.length)return;
      const q=calcQuote(state.cart,state.client);
      if(!q.allKnown||q.travelPending){state.view='review';render();return;}
      if(!validateClient()){state.view='booking';render();return;}
      state.activationOpen=false;state.view='checkout';render();return;
    }
    if(action==='backReview'){state.activationOpen=false;state.view='review';render();return;}
    if(action==='choosePayment'){if(id==='credit'||id==='debit'){state.paymentMethod=id;render(false);}return;}
    if(action==='payNow'){state.activationOpen=true;render(false);document.querySelector('.activation-dialog')?.focus();return;}
    if(action==='closePayment'){state.activationOpen=false;render(false);return;}
    if(action==='review'){if(!validateClient()){state.view='booking';render(false);const error=document.querySelector('.error');error?.scrollIntoView({block:'center',behavior:'smooth'});return;}state.view='review';render();return;}
    if(action==='backBooking'){state.view='booking';render();return;}
    if(action==='sendWhatsapp'){
      if(!isQuoteVisit())return;
      if(!state.client.consent){state.errors.consent='Marca la casilla para continuar.';const el=document.getElementById('consent-error');if(el)el.textContent=state.errors.consent;return;}
      if(!validateClient()){state.view='booking';render();return;}
      state.waUrl=`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(requestText())}`;
      const win=window.open(state.waUrl,'_blank','noopener,noreferrer');
      const box=document.getElementById('copy-result');if(box)box.innerHTML=`Tu solicitud está lista para enviar. <a href="${esc(state.waUrl)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp ${icon('external',13)}</a>. Revisa y presiona Enviar dentro de WhatsApp.`;
      if(win)win.opener=null;
      return;
    }
    if(action==='copyText'){copyText();return;}
  });
  $root.addEventListener('input',e=>{
    const f=e.target.dataset.field;if(!f)return;
    if(f==='search'){state.query=e.target.value;const start=e.target.selectionStart;const wasFocus=e.target;render(false);const next=document.querySelector('[data-field="search"]');next?.focus();if(next&&start!=null)next.setSelectionRange(start,start);return;}
    const [scope,key]=f.split(':');if(scope==='draft'){if(key==='note')state.draft.note=e.target.value;else state.draft.details[key]=e.target.value;}
    if(scope==='client'){state.client[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(state.errors[key])delete state.errors[key];if(key==='commune'){render(false);return;}}
  });
  $root.addEventListener('change',e=>{const f=e.target.dataset.field;if(!f)return;const [scope,key]=f.split(':');if(scope==='draft'){state.draft.details[key]=e.target.value;return;}if(scope==='client'){state.client[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(state.errors[key])delete state.errors[key];if(key==='commune'){render(false);return;}}});
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  render();
  // Exponer exclusivamente cálculos sin datos personales para pruebas automatizadas.
  window.VillablancaTest = {calcQuote,requestText,appointmentKind,validPhone:p=>/^(?:56)?9\d{8}$/.test(p.replace(/[^0-9]/g,'')),todayChile};
})();

</script>
</body>
</html>
